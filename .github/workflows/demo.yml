name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Lumberman - Desktop - Development1.asset"

      # 4. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 8. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ WebGL 빌드 & 배포 성공"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ✅ *${{ github.repository }}* 빌드 & 배포 완료!
                    📝 커밋: ${{ github.event.head_commit.message }}
                    👤 작성자: ${{ github.actor }}
                    🌐 <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|플레이하기>

  # 빌드 실패 시 AI 분석 + 슬랙 알림 (별도 job — build job 완료 후 로그 API 접근 가능)
  notify-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()

    steps:
      # 1. 빌드 로그 다운로드
      - name: Download Build Logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "build") | .id')
          echo "Build JOB_ID: $JOB_ID"

          if [ -n "$JOB_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/full-job-log.txt 2>/dev/null
            echo "Log size: $(wc -c < /tmp/full-job-log.txt) bytes"
          fi

          if [ -s /tmp/full-job-log.txt ]; then
            grep -iE "(error CS[0-9]|error:|exception|failed|fatal|Aborting batchmode|CompilerOutput|Build completed with a result of 'Failed')" \
              /tmp/full-job-log.txt | tail -c 100000 > /tmp/filtered-log.txt

            if [ ! -s /tmp/filtered-log.txt ]; then
              tail -c 100000 /tmp/full-job-log.txt > /tmp/filtered-log.txt
            fi
          else
            echo "빌드 로그를 가져올 수 없습니다." > /tmp/filtered-log.txt
          fi

          DELIM="FILTERED_LOG_$(openssl rand -hex 8)"
          {
            echo "FILTERED_LOG<<${DELIM}"
            head -c 80000 /tmp/filtered-log.txt
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      # 2. AI 실패 분석
      - name: AI Failure Analysis
        continue-on-error: true
        timeout-minutes: 2
        id: ai-analysis
        uses: google-github-actions/run-gemini-cli@v0.1.20
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          prompt: |
            다음은 Unity WebGL 빌드 실패 로그입니다.
            반드시 아래 JSON 형식으로만 응답하세요. JSON 외의 텍스트나 코드 펜스를 포함하지 마세요.

            {"causes":[{"summary":"근본 원인 요약","location":"파일 경로:라인","solution":"해결 방법"}]}

            규칙:
            - 연쇄 에러(같은 원인에서 파생)는 근본 원인 1개로 묶어 causes에 1개만 추가
            - 독립 원인이 여러 개면 causes에 각각 추가
            - 모든 값은 한국어로 작성

            --- 로그 시작 ---
            ${{ env.FILTERED_LOG }}
            --- 로그 끝 ---

      # 3. AI 분석 결과 포맷팅
      - name: Format AI Analysis
        continue-on-error: true
        id: format-analysis
        env:
          AI_RAW: ${{ steps.ai-analysis.outputs.summary }}
        run: |
          if [ -z "$AI_RAW" ]; then
            FORMATTED="AI 분석을 수행할 수 없습니다."
          else
            printf '%s' "$AI_RAW" > /tmp/ai-raw.txt
            grep -v '^```' /tmp/ai-raw.txt > /tmp/ai-json.txt

            FORMATTED=$(jq -r '
              .causes | to_entries[] |
              "*[\(.key + 1)] \(.value.summary)*\n• 위치: `\(.value.location)`\n• 해결: \(.value.solution)"
            ' /tmp/ai-json.txt 2>/dev/null)

            if [ -z "$FORMATTED" ]; then
              FORMATTED=$(cat /tmp/ai-raw.txt)
            fi
          fi

          {
            echo "formatted<<SLACKEOF"
            echo "$FORMATTED"
            echo "SLACKEOF"
          } >> "$GITHUB_OUTPUT"

      # 4. 슬랙 알림 (실패)
      - name: Slack Notification (Failure)
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ WebGL 빌드 실패"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    🔥 *${{ github.repository }}* 빌드 실패!
                    📝 커밋: ${{ github.event.head_commit.message }}
                    👤 작성자: ${{ github.actor }}
                    🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    🤖 *AI 분석:*
                    ${{ steps.format-analysis.outputs.formatted || 'AI 분석을 수행할 수 없습니다.' }}
